                - body
            properties:
                tag:
                    type: string
                name:
                    type: string
                prerelease:
                    type: boolean
                publishedAt:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UnixtimeMS'
                htmlUrl:
                    type: string
                body:
                    type: string

        UpdateJobLogLine:
