                    description: 'true: 確定シリーズ (または新規作成予定) / false: 未確定 (候補のみ)'
                    type: boolean
                seriesId:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/SeriesId'
                seriesTitle:
                    type: string
                    nullable: true
                confidence:
                    type: number
                    nullable: true
                candidates:
                    type: array
                    items:
                        $ref: '#/components/schemas/SeriesBackfillPreviewCandidate'

