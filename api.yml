            type: object
            required:
                - updated
            properties:
                updated:
                    description: 取得に成功し反映されたか (URL 未設定・取得失敗時は false)
                    type: boolean

        AuthRole:
            description: ログインユーザーの権限 (admin = システム管理者 / user = 一般)
            type: string
            enum: [admin, user]

        AuthProviderItem:
            description: 設定済みの外部 ID プロバイダ (秘密情報は含まない)
            type: object
