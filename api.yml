                - shortSha
                - message
                - committedAt
                - htmlUrl
                - upToDate
            properties:
                name:
                    type: string
                sha:
                    type: string
                shortSha:
                    type: string
                message:
                    type: string
                committedAt:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UnixtimeMS'
                htmlUrl:
                    type: string
                upToDate:
                    type: boolean

        UpdateStatus:
            description: 更新状況
            type: object
            required:
