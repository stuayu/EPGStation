                - linked
                - pending
                - skipped
                - failed
                - startedAt
                - finishedAt
                - lastRecordedId
                - error
            properties:
                state:
                    $ref: '#/components/schemas/SeriesBackfillState'
                dryRun:
                    type: boolean
                total:
                    description: 対象総数 (処理済み + 残件数。処理が進むごとに更新される)
                    type: integer
                processed:
                    type: integer
                linked:
                    description: シリーズへリンクされた (または新規シリーズが作成された) 件数
                    type: integer
                pending:
                    description: 未確定キューへ積まれた件数
                    type: integer
                skipped:
                    description: manualLock 済み、またはタイトルが解決できず何もしなかった件数
                    type: integer
                failed:
                    type: integer
                startedAt:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UnixtimeMS'
                finishedAt:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UnixtimeMS'
                lastRecordedId:
                    $ref: '#/components/schemas/RecordedId'
                error:
                    type: string
                    nullable: true
                previewItems:
                    type: array
                    items:
                        $ref: '#/components/schemas/SeriesBackfillPreviewItem'
                previewTruncated:
                    type: boolean
                onlyUnlinked:
                    description: 実行時に指定された「未リンクのみ」条件
                    type: boolean
                latest:
                    description: 実行時に指定された「直近 N 件のみ」条件
                    type: integer
                    nullable: true

