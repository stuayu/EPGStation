                - currentIsPrerelease
                - latestStable
                - latestPrerelease
                - availableRelease
                - availableChannel
                - checkedAt
                - checkError
                - branch
                - currentCommit
                - installationType
                - supervisor
                - canUpdate
                - updateNote
                - restartNote
                - releasesUrl
                - job
            properties:
                currentVersion:
                    type: string
                currentIsPrerelease:
                    type: boolean
                latestStable:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UpdateReleaseInfo'
                latestPrerelease:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UpdateReleaseInfo'
                availableRelease:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UpdateReleaseInfo'
                availableChannel:
                    type: string
                    nullable: true
                    enum: [stable, prerelease]
                checkedAt:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UnixtimeMS'
                checkError:
                    type: string
                    nullable: true
                branch:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UpdateBranchInfo'
                currentCommit:
                    type: string
                    nullable: true
                installationType:
                    type: string
                    enum: [git, archive]
                supervisor:
                    type: string
                    enum: [docker, systemd, pm2, windows-service, none]
                canUpdate:
                    type: boolean
                updateNote:
                    type: string
                restartNote:
                    description: 更新を伴わない再起動の挙動の説明
                    type: string
                releasesUrl:
                    type: string
                job:
                    $ref: '#/components/schemas/UpdateJob'

        RunUpdateOption:
            description: 更新実行のリクエストボディ
            type: object
            properties:
                tag:
                    description: 更新先のタグ (省略時は最新リリース)
                    type: string
                refType:
                    description: 更新先の指定方法。branch はブランチの最新コミットへ追従する (既定 tag)
                    type: string
                    enum: [tag, branch]
                ref:
                    description: refType が branch のときの対象ブランチ (省略時は設定のブランチ)
                    type: string
                restart:
                    description: 更新完了後に再起動するか (既定 true)
                    type: boolean

        UpdateRestartResult:
            description: 再起動の受付結果
            type: object
            required:
                - supervisor
                - note
                - restartAt
            properties:
                supervisor:
                    description: 再起動を担う仕組み
                    type: string
                    enum: [docker, systemd, pm2, windows-service, none]
                note:
                    description: 再起動の挙動の説明
                    type: string
                restartAt:
                    description: プロセスを終了する予定時刻
                    allOf:
                        - $ref: '#/components/schemas/UnixtimeMS'

