                - role
                - hasPassword
                - providers
                - createdAt
            properties:
                id:
                    type: integer
                name:
                    type: string
                role:
                    $ref: '#/components/schemas/AuthRole'
                hasPassword:
                    description: パスワードでログインできるか (SSO のみのユーザーは false)
                    type: boolean
                providers:
                    description: 紐付いている外部 ID プロバイダ
                    type: array
                    items:
                        type: string
                createdAt:
                    $ref: '#/components/schemas/UnixtimeMS'

        AuthStatus:
            description: 認証状態
            type: object
            required:
