            properties:
                at:
                    $ref: '#/components/schemas/UnixtimeMS'
                level:
                    type: string
                    enum: [info, command, error]
                message:
                    type: string

        UpdateJob:
            description: 更新ジョブ
            type: object
            required:
                - status
                - tag
                - step
                - startedAt
                - finishedAt
                - error
                - logs
            properties:
                status:
                    type: string
                    enum: [idle, running, succeeded, failed, restarting]
                tag:
                    type: string
                    nullable: true
                step:
                    type: string
                    nullable: true
                startedAt:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UnixtimeMS'
                finishedAt:
                    nullable: true
                    allOf:
                        - $ref: '#/components/schemas/UnixtimeMS'
                error:
                    type: string
                    nullable: true
                logs:
                    type: array
                    items:
                        $ref: '#/components/schemas/UpdateJobLogLine'

        UpdateBranchInfo:
            description: 追従先ブランチ (main 等) の最新コミット
            type: object
            required:
                - name
