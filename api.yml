                - password
            properties:
                name:
                    type: string
                    maxLength: 64
                password:
                    type: string
                    maxLength: 200

        ChangePasswordOption:
            description: パスワード変更のリクエストボディ
            type: object
            required:
                - newPassword
            properties:
                newPassword:
                    type: string
                    maxLength: 200
                currentPassword:
                    description: 自分のパスワードを変更する場合に必要
                    type: string
                    maxLength: 200

        UpdateReleaseInfo:
            description: 公開されているリリース 1 件分
            type: object
            required:
                - tag
