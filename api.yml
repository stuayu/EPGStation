openapi: 3.0.1
info:
    version: '~'
    title: '~'
    license:
        name: MIT
        url: https://github.com/l3tnun/EPGStation/blob/master/LICENSE

servers: []

paths: {}

components:
    schemas:
        UnixtimeMS:
            description: 時刻 (ms)
            type: integer

        ChannelId:
            description: 放送局 id
            type: integer
            maximum: 6553565535

        ServiceId:
            description: service id
            type: integer
            maximum: 6553565535

        NetworkId:
            description: network id
            type: integer
            maximum: 6553565535

        ProgramId:
            description: program id
            type: integer
            maximum: 655356553565535

        EventId:
            description: event id
            type: integer
            maximum: 655356553565535

        RuleId:
            description: ルール id
            type: integer

        ReserveId:
            description: 予約 id
            type: integer

        RecordedId:
            description: 録画済み番組 id
            type: integer

        RecordedHistoryId:
            description: 録画済み番組履歴管理 id
            type: integer

        VideoFileId:
            description: ビデオファイル id
            type: integer

        VideoFileType:
            description: ビデオファイル形式
            type: string
            enum:
                - 'ts'
                - 'encoded'

        ThumbnailId:
            description: サムネイル id
            type: integer

        DropLogFileId:
            description: ドロップログファイル id
            type: integer

        RecordedTagId:
            description: 録画 tag id
            type: integer

        SavedSearchId:
            description: 保存検索 id
            type: integer

        EncodeId:
            description: エンコード id
            type: integer

        ChannelType:
            description: 放送波タイプ
            type: string
            enum:
                - GR
                - BS
                - CS
                - SKY
                - NW1
                - NW2
                - NW3
                - NW4
                - NW5
                - NW6
                - NW7
                - NW8
                - NW9
                - NW10
                - NW11
                - NW12
                - NW13
                - NW14
                - NW15
                - NW16
                - NW17
                - NW18
                - NW19
                - NW20
                - NW21
                - NW22
                - NW23
                - NW24
                - NW25
                - NW26
                - NW27
                - NW28
                - NW29
                - NW30
                - NW31
                - NW32
                - NW33
                - NW34
                - NW35
                - NW36
                - NW37
                - NW38
                - NW39
                - NW40

        ProgramGenreLv1:
            description: ジャンル
            type: integer

        ProgramGenreLv2:
            description: サブジャンル
            type: integer

        ProgramVideoType:
            description: 番組ビデオコーデック
            type: string
            enum:
                - mpeg2
                - h.264
                - h.265

        ProgramVideoResolution:
            description: 番組ビデオ解像度
            type: string
            enum:
                - 240p
                - 480i
                - 480p
                - 720p
                - 1080i
                - 1080p
                - 2160p
                - 4320p

        ProgramAudioSamplingRate:
            description: 番組オーディオサンプリングレート
            type: integer
            enum:
                - 16000 # 001
                - 22050 # 010
                - 24000 # 011
                - 32000 # 101
                - 44100 # 110
                - 48000 # 111

        StreamId:
            description: ストリーム id
            type: integer

        StreamType:
            description: ストリームの種類
            type: string
            enum:
                - LiveStream
                - LiveHLS
                - RecordedStream
                - RecordedHLS

        URLSchemeInfo:
            description: URL Scheme
            type: object
            properties:
                ios:
                    type: string
                android:
                    type: string
                mac:
                    type: string
                win:
                    type: string

        M2TSStreamParam:
            description: M2TS形式ストリーミングパラメータ
            type: object
            required:
                - name
                - isUnconverted
            properties:
                name:
                    description: 表示名
                    type: string
                isUnconverted:
                    description: 無変換か
                    type: boolean

        StreamContainer:
            description: 配信コンテナ種別
            type: string
            enum:
                - m2ts
                - m2tsll
                - mp4
                - webm
                - hls

        StreamVideoParam:
            description: 配信プリセットの映像設定
            type: object
            properties:
                codec:
                    type: string
                width:
                    type: integer
                height:
                    type: integer
                bitrate:
                    description: kbps
                    type: integer

        StreamAudioParam:
            description: 配信プリセットの音声設定
            type: object
            properties:
                codec:
                    type: string
                bitrate:
                    description: kbps
                    type: integer

        ClientStreamProfile:
            description: クライアントへ公開する id ベースの配信プリセット情報 (cmd は含まない)
            type: object
            required:
                - id
                - name
                - container
            properties:
                id:
                    type: string
                name:
                    type: string
                container:
                    $ref: '#/components/schemas/StreamContainer'
                video:
                    $ref: '#/components/schemas/StreamVideoParam'
                audio:
                    $ref: '#/components/schemas/StreamAudioParam'
                isUnconverted:
                    description: 無変換か
                    type: boolean

        ClientEncodePreset:
            description: クライアントへ公開する id ベースのエンコードプリセット情報 (cmd は含まない)
            type: object
            required:
                - id
                - name
            properties:
                id:
                    type: string
                name:
                    type: string
                video:
                    $ref: '#/components/schemas/StreamVideoParam'
                audio:
                    $ref: '#/components/schemas/StreamAudioParam'

        Config:
            description: コンフィグ
            type: object
            required:
                - socketIOPort
                - broadcast
                - recorded
                - encode
                - urlscheme
                - isEnableTSLiveStream
                - isEnableTSRecordedStream
                - isEnableEncodedRecordedStream
            properties:
                socketIOPort:
                    description: socket.io 通信で使用するポート
                    type: integer
                broadcast:
                    description: 有効な放送波情報
                    type: object
                    required:
                        - GR
                        - BS
                        - CS
                        - SKY
                        - NW1
                        - NW2
                        - NW3
                        - NW4
                        - NW5
                        - NW6
                        - NW7
                        - NW8
                        - NW9
                        - NW10
                        - NW11
                        - NW12
                        - NW13
                        - NW14
                        - NW15
                        - NW16
                        - NW17
                        - NW18
                        - NW19
                        - NW20
                    properties:
                        GR:
                            type: boolean
                        BS:
                            type: boolean
                        CS:
                            type: boolean
                        SKY:
                            type: boolean
                        NW1:
                            type: boolean
                        NW2:
                            type: boolean
                        NW3:
                            type: boolean
                        NW4:
                            type: boolean
                        NW5:
                            type: boolean
                        NW6:
                            type: boolean
                        NW7:
                            type: boolean
                        NW8:
                            type: boolean
                        NW9:
                            type: boolean
                        NW10:
                            type: boolean
                        NW11:
                            type: boolean
                        NW12:
                            type: boolean
                        NW13:
                            type: boolean
                        NW14:
                            type: boolean
                        NW15:
                            type: boolean
                        NW16:
                            type: boolean
                        NW17:
                            type: boolean
                        NW18:
                            type: boolean
                        NW19:
                            type: boolean
                        NW20:
                            type: boolean
                        NW21:
                            type: boolean
                        NW22:
                            type: boolean
                        NW23:
                            type: boolean
                        NW24:
                            type: boolean
                        NW25:
                            type: boolean
                        NW26:
                            type: boolean
                        NW27:
                            type: boolean
                        NW28:
                            type: boolean
                        NW29:
                            type: boolean
                        NW30:
                            type: boolean
                        NW31:
                            type: boolean
                        NW32:
                            type: boolean
                        NW33:
                            type: boolean
                        NW34:
                            type: boolean
                        NW35:
                            type: boolean
                        NW36:
                            type: boolean
                        NW37:
                            type: boolean
                        NW38:
                            type: boolean
                        NW39:
                            type: boolean
                        NW40:
                            type: boolean
                recorded:
                    description: 指定可能な録画ディレクトリ名
                    type: array
                    items:
                        type: string
                encode:
                    description: エンコードモード
                    type: array
                    items:
                        type: string
                urlscheme:
                    description: URL Scheme 情報
                    type: object
                    required:
                        - m2ts
                        - video
                        - download
                    properties:
                        m2ts:
                            $ref: '#/components/schemas/URLSchemeInfo'
                        video:
                            $ref: '#/components/schemas/URLSchemeInfo'
                        download:
                            $ref: '#/components/schemas/URLSchemeInfo'
                isEnableTSLiveStream:
                    description: ライブ視聴が有効か
                    type: boolean
                isEnableTSRecordedStream:
                    description: 録画済みの TS ファイルのストリーミングが有効か
                    type: boolean
                isEnableEncodedRecordedStream:
                    description: 録画済みのエンコード済みファイルのストリーミングが有効か
                    type: boolean
                streamConfig:
                    description: ストリーミング設定
                    type: object
                    properties:
                        live:
                            description: ライブストリーミング設定
                            type: object
                            properties:
                                m2ts:
                                    description: ライブ M2TS ストリーミング設定
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/M2TSStreamParam'
                                m2tsll:
                                    description: ライブ M2TS Low Latency (mpegts.js 用) ストリーミング設定
                                    type: array
                                    items:
                                        type: string
                                webm:
                                    description: ライブ WebM ストリーミング設定
                                    type: array
                                    items:
                                        type: string
                                mp4:
                                    description: ライブ MP4 ストリーミング設定
                                    type: array
                                    items:
                                        type: string
                                hls:
                                    description: ライブ HLS ストリーミング設定
                                    type: array
                                    items:
                                        type: string
                        recorded:
                            description: 録画済みストリーミング設定
                            type: object
                            properties:
                                ts:
                                    description: 録画済み TS ファイルのストリーミング設定
                                    type: object
                                    properties:
                                        webm:
                                            description: 録画済み TS ファイルの WebM ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                        mp4:
                                            description: 録画済み TS ファイルの MP4 ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                        hls:
                                            description: 録画済み TS ファイルの HLS ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                encoded:
                                    description: 録画エンコード済みファイルのストリーミング設定
                                    type: object
                                    properties:
                                        webm:
                                            description: 録画エンコード済みファイルの WebM ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                        mp4:
                                            description: 録画エンコード済みファイルの MP4 ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                                        hls:
                                            description: 録画エンコード済みファイルの HLS ストリーミング設定
                                            type: array
                                            items:
                                                type: string
                streamProfiles:
                    description: id ベースの配信プリセット情報 (新形式)。streamConfig と併存する
                    type: object
                    properties:
                        live:
                            description: ライブ配信の配信プリセット一覧
                            type: array
                            items:
                                $ref: '#/components/schemas/ClientStreamProfile'
                        recorded:
                            description: 録画配信の配信プリセット一覧
                            type: object
                            properties:
                                ts:
                                    description: 録画済み TS ファイルの配信プリセット一覧
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/ClientStreamProfile'
                                encoded:
                                    description: 録画エンコード済みファイルの配信プリセット一覧
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/ClientStreamProfile'
                encodePresets:
                    description: id ベースのエンコードプリセット情報 (新形式)。encode と併存する
                    type: array
                    items:
                        $ref: '#/components/schemas/ClientEncodePreset'
                kodiHosts:
                    description: kodi hosts
                    type: array
                    items:
                        type: string
                featureFlags:
                    $ref: '#/components/schemas/FeatureFlags'
                importDirs:
                    description: 外部録画ファイル取り込みが許可されたディレクトリ名一覧 (featureFlags.externalFileImport が有効な場合のみ意味を持つ)
                    type: array
                    items:
                        type: string

        FeatureFlags:
            description: 段階導入用の機能フラグ。クライアントはこれを見て機能の表示可否を判断する
            type: object
            properties:
                watchHistory:
                    type: boolean
                notifications:
                    type: boolean
                dashboard:
                    type: boolean
                systemSettings:
                    type: boolean
                seriesLibrary:
                    type: boolean
                metadataProviders:
                    type: boolean
                programSeriesMapping:
                    type: boolean
                annictSync:
                    type: boolean
                nextUpPanel:
                    type: boolean
                externalFileImport:
                    type: boolean
                advancedSearch:
                    type: boolean
                updateNotification:
                    type: boolean

        ChannelItems:
            type: array
            items:
                $ref: '#/components/schemas/ChannelItem'

        ChannelItem:
            description: チャンネル情報
            required:
                - id
                - serviceId
                - networkId
                - name
                - halfWidthName
                - remoteControlKeyId
                - hasLogoData
                - channelType
                - channel
            properties:
                id:
                    $ref: '#/components/schemas/ChannelId'
                serviceId:
                    $ref: '#/components/schemas/ServiceId'
                networkId:
                    $ref: '#/components/schemas/NetworkId'
                name:
                    description: 放送局名
                    type: string
                halfWidthName:
                    description: 放送局名(半角)
                    type: string
                hasLogoData:
                    description: ロゴデータを持っているか
                    type: boolean
                channelType:
                    $ref: '#/components/schemas/ChannelType'
                channel:
                    type: string
                type:
                    type: number
                region:
                    $ref: '#/components/schemas/BroadcastRegionItem'
                affiliation:
                    $ref: '#/components/schemas/BroadcastAffiliationItem'

        BroadcastRegionItem:
            description: 地上デジタル放送の地域
            type: object
            required:
                - id
                - name
                - order
            properties:
                id:
                    description: 地域 id
                    type: string
                name:
                    description: 地域表示名
                    type: string
                order:
                    description: 表示順 (都道府県コード。判定不能な「その他」は 99)
                    type: number

        BroadcastAffiliationItem:
            description: 地上デジタル放送の系列 (BIT の系列識別ベース)
            type: object
            required:
                - id
                - name
                - order
            properties:
                id:
                    description: 系列 id
                    type: string
                name:
                    description: 系列表示名
                    type: string
                order:
                    description: 表示順 (独立系は 90、未分類は 99)
                    type: number

        ScheduleChannleItem:
            description: 番組表の放送局データ
            required:
                - id
                - serviceId
                - networkId
                - name
                - hasLogoData
                - channelType
            properties:
                id:
                    $ref: '#/components/schemas/ChannelId'
                serviceId:
                    $ref: '#/components/schemas/ServiceId'
                networkId:
                    $ref: '#/components/schemas/NetworkId'
                name:
                    description: 放送局名
                    type: string
                remoteControlKeyId:
                    description: リモコン番号
                    type: integer
                hasLogoData:
                    description: ロゴデータを持っているか
                    type: boolean
                channelType:
                    $ref: '#/components/schemas/ChannelType'
                type:
                    type: number
                region:
                    $ref: '#/components/schemas/BroadcastRegionItem'
                affiliation:
                    $ref: '#/components/schemas/BroadcastAffiliationItem'

        ScheduleProgramItem:
            description: 番組表の番組データ
            required:
                - id
                - channelId
                - startAt
                - endAt
                - isFree
                - name
            properties:
                id:
                    $ref: '#/components/schemas/ProgramId'
                channelId:
                    $ref: '#/components/schemas/ChannelId'
                startAt:
                    $ref: '#/components/schemas/UnixtimeMS'
                endAt:
                    $ref: '#/components/schemas/UnixtimeMS'
                isDurationUndefined:
                    description: 放送時間未定 (ARIB の duration = 0xFFFFFF) の番組か。true の場合 endAt は暫定値
                    type: boolean
                isFree:
                    description: 無料放送か
                    type: boolean
                name:
                    description: 番組名
                    type: string
                description:
                    description: 番組詳細
                    type: string
                extended:
                    description: 番組拡張
                    type: string
                rawExtended:
                    description: 番組拡張 (Mirakurun の extended)
                    type: object
                genre1:
                    $ref: '#/components/schemas/ProgramGenreLv1'
                subGenre1:
                    $ref: '#/components/schemas/ProgramGenreLv2'
                genre2:
                    $ref: '#/components/schemas/ProgramGenreLv1'
                subGenre2:
                    $ref: '#/components/schemas/ProgramGenreLv2'
                genre3:
                    $ref: '#/components/schemas/ProgramGenreLv1'
                subGenre3:
                    $ref: '#/components/schemas/ProgramGenreLv2'
                videoType:
                    $ref: '#/components/schemas/ProgramVideoType'
                videoResolution:
                    $ref: '#/components/schemas/ProgramVideoResolution'
                videoStreamContent:
                    type: integer
                videoComponentType:
                    type: integer
                audioSamplingRate:
                    $ref: '#/components/schemas/ProgramAudioSamplingRate'
                audioComponentType:
                    type: integer

        ScheduleProgramItems:
            type: array
            items:
                $ref: '#/components/schemas/ScheduleProgramItem'

        Schedule:
            description: 番組表データ
            required:
                - channel
                - programs
            properties:
                channel:
                    $ref: '#/components/schemas/ScheduleChannleItem'
                programs:
                    $ref: '#/components/schemas/ScheduleProgramItems'

        Schedules:
            type: array
            items:
                $ref: '#/components/schemas/Schedule'

        ScheduleSearchOption:
            description: 番組検索オプション
            type: object
            required:
                - option
                - isHalfWidth
            properties:
                option:
                    $ref: '#/components/schemas/RuleSearchOption'
                isHalfWidth:
                    description: 半角文字で取得するか
                    type: boolean
                limit:
                    description: 検索結果取得最大件数
                    type: number

        Rules:
            description: ルール情報
            type: object
            required:
                - rules
                - total
            properties:
                rules:
                    type: array
                    items:
                        $ref: '#/components/schemas/Rule'
                total:
                    description: ルール総件数
                    type: integer

        Rule:
            description: ルール
            type: object
            required:
                - id
            properties:
                id:
                    $ref: '#/components/schemas/RuleId'
                reservesCnt:
                    description: 予約件数
                    type: integer
            allOf:
                - $ref: '#/components/schemas/AddRuleOption'

        RuleKeywordItem:
            type: object
            required:
                - id
                - keyword
            properties:
                id:
                    $ref: '#/components/schemas/RuleId'
                keyword:
                    type: string

        RuleKeywordInfo:
            description: ルールキーワード検索結果
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/RuleKeywordItem'

        AddRuleOption:
            description: ルール追加プション
            type: object
            required:
                - isTimeSpecification
                - searchOption
                - reserveOption
            properties:
                isTimeSpecification:
                    description: 時刻指定予約か
                    type: boolean
                searchOption:
                    $ref: '#/components/schemas/RuleSearchOption'
                reserveOption:
                    $ref: '#/components/schemas/RuleReserveOption'
                saveOption:
                    $ref: '#/components/schemas/ReserveSaveOption'
                encodeOption:
                    $ref: '#/components/schemas/ReserveEncodedOption'

        RuleSearchOption:
            description: ルール検索オプション
            type: object
            properties:
                keyword:
                    description: 検索キーワード
                    type: string
                ignoreKeyword:
                    description: 除外検索キーワード
                    type: string
                keyCS:
                    description: 大文字小文字区別有効化 (検索キーワード)
                    type: boolean
                keyRegExp:
                    description: 正規表現 (検索キーワード)
                    type: boolean
                name:
                    description: 番組名 (検索キーワード)
                    type: boolean
                description:
                    description: 概要 (検索キーワード)
                    type: boolean
                extended:
                    description: 詳細 (検索キーワード)
                    type: boolean
                ignoreKeyCS:
                    description: 大文字小文字区別有効化 (除外検索キーワード)
                    type: boolean
                ignoreKeyRegExp:
                    description: 正規表現 (除外検索キーワード)
                    type: boolean
                ignoreName:
                    description: 番組名 (除外検索キーワード)
                    type: boolean
                ignoreDescription:
                    description: 概要 (除外検索キーワード)
                    type: boolean
                ignoreExtended:
                    description: 詳細 (除外検索キーワード)
                    type: boolean
                GR:
                    description: GR
                    type: boolean
                BS:
                    description: BS
                    type: boolean
                CS:
                    description: CS
                    type: boolean
                SKY:
                    description: SKY
                    type: boolean
                NW1:
                    description: NW
                    type: boolean
                NW2:
                    description: NW
                    type: boolean
                NW3:
                    description: NW
                    type: boolean
                NW4:
                    description: NW
                    type: boolean
                NW5:
                    description: NW
                    type: boolean
                NW6:
                    description: NW
                    type: boolean
                NW7:
                    description: NW
                    type: boolean
                NW8:
                    description: NW
                    type: boolean
                NW9:
                    description: NW
                    type: boolean
                NW10:
                    description: NW
                    type: boolean
                NW11:
                    description: NW
                    type: boolean
                NW12:
                    description: NW
                    type: boolean
                NW13:
                    description: NW
                    type: boolean
                NW14:
                    description: NW
                    type: boolean
                NW15:
                    description: NW
                    type: boolean
                NW16:
                    description: NW
                    type: boolean
                NW17:
                    description: NW
                    type: boolean
                NW18:
                    description: NW
                    type: boolean
                NW19:
                    description: NW
                    type: boolean
                NW20:
                    description: NW
                    type: boolean
                NW21:
                    description: NW
                    type: boolean
                NW22:
                    description: NW
                    type: boolean
                NW23:
                    description: NW
                    type: boolean
                NW24:
                    description: NW
                    type: boolean
                NW25:
                    description: NW
                    type: boolean
                NW26:
                    description: NW
                    type: boolean
                NW27:
                    description: NW
                    type: boolean
                NW28:
                    description: NW
                    type: boolean
                NW29:
                    description: NW
                    type: boolean
                NW30:
                    description: NW
                    type: boolean
                NW31:
