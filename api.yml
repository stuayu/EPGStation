                        - $ref: '#/components/schemas/UnixtimeMS'
            required:
                - unmatchedRate
                - confidenceHistogram
                - totalPrograms
                - matchedPrograms
                - updatedAt

        AnnictWatchSyncResult:
            description: Annict 視聴記録の手動再同期結果 (§5.5)
            type: object
            properties:
                queued:
                    description: 同期キューへ積んだ (積み直した) 件数
                    type: integer
            required:
                - queued

        MissingEpisodeProposalCandidate:
            type: object
