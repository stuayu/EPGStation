                - allowAnonymous
            properties:
                enabled:
                    description: config.yml の auth.enabled
                    type: boolean
                initialized:
                    description: 初期ユーザーが作成済みか
                    type: boolean
                user:
                    nullable: true
                    type: object
                    required:
                        - id
                        - name
                        - role
                    properties:
                        id:
                            type: integer
                        name:
                            type: string
                        role:
                            $ref: '#/components/schemas/AuthRole'
                providers:
                    description: 設定済みの外部 ID プロバイダ (ログイン画面のボタン用)
                    type: array
                    items:
                        $ref: '#/components/schemas/AuthProviderItem'
                allowSignUp:
                    description: 2 人目以降のサインアップを許可しているか
                    type: boolean
                allowAnonymous:
                    description: 未ログインでも一般ユーザーと同じ操作を許可しているか
                    type: boolean

        AuthCredentialOption:
            description: ログイン / 初期セットアップのリクエストボディ
            type: object
            required:
