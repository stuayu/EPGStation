                        $ref: '#/components/schemas/MissingEpisodeProposalCandidate'
            required:
                - seasonNumber
                - episodeNumber
                - candidates

        MissingEpisodeProposals:
            type: object
            properties:
                proposals:
                    type: array
                    items:
                        $ref: '#/components/schemas/MissingEpisodeProposal'
            required:
                - proposals

        ConfigFieldInfo:
            description: config.yml の編集可能なキー
            type: object
            required:
                - key
                - requiresRestart
            properties:
                key:
                    type: string
                requiresRestart:
                    description: 変更に EPGStation の再起動が必要か
                    type: boolean

        EditableConfig:
            description: config.yml 編集画面用の情報
            type: object
            required:
                - effective
                - file
                - overlay
                - fields
            properties:
                effective:
                    description: config.yml + GUI の差分を重ねた実効値 (秘密情報はマスク済み)
                    type: object
                    additionalProperties: true
                file:
                    description: config.yml をそのまま読んだ値
                    type: object
                    additionalProperties: true
                overlay:
                    description: GUI で保存されている差分
                    type: object
                    additionalProperties: true
                fields:
                    type: array
                    items:
                        $ref: '#/components/schemas/ConfigFieldInfo'

        AppSettingValue:
            description: >-
                システム設定 (トップレベルキーごとの値。metadata / notifications / series / dashboard / logging)。
                構造は src/model/api/config/AppSettingSchema.ts の JSON Schema が正であり、
                ここでは詳細な形は規定しない (任意の JSON オブジェクト)
            type: object
            additionalProperties: true

        AppSettingUpdateResult:
            description: システム設定更新・ロールバック結果
            type: object
            required:
                - settings
                - requiresRestart
                - requiresRestartKeys
            properties:
                settings:
                    $ref: '#/components/schemas/AppSettingValue'
                requiresRestart:
                    description: 今回の更新に Operator の再初期化を要するキーが含まれていたか
                    type: boolean
                requiresRestartKeys:
                    description: 再起動 (再初期化) を要すると判定されたキーの一覧
                    type: array
                    items:
                        type: string

        AppSettingHistoryItem:
            description: システム設定の変更履歴 1 件分 (前の値そのものは含まない)
            type: object
            required:
                - id
                - key
                - updatedAt
            properties:
                id:
                    type: integer
                key:
                    type: string
                updatedAt:
                    $ref: '#/components/schemas/UnixtimeMS'

        NotificationTestResult:
            description: 通知テスト送信結果
            type: object
            required:
                - delivered
                - failed
            properties:
                delivered:
                    description: 配信に成功した通知先名の一覧
                    type: array
                    items:
                        type: string
                failed:
                    description: 配信に失敗した通知先名の一覧
                    type: array
                    items:
                        type: string

        AnnictConnectionTestResult:
            description: Annict 接続テスト結果 (viewer クエリでの疎通・トークンの有効性確認, §6.2)
            type: object
            required:
                - ok
            properties:
                ok:
                    type: boolean
                username:
                    description: 疎通に成功した場合の Annict ユーザー名
                    type: string
                message:
                    description: 失敗時のエラー内容 (AnnictSyncFeatureIsDisabled / AnnictAuthenticationFailed 等)
                    type: string

        SyobocalChannelMapEntry:
            description: しょぼいカレンダー ChID ⇄ Mirakurun networkId/serviceId のマッピング表 1 エントリ (§5.3・§6.2)
            type: object
            required:
                - chId
                - networkId
                - serviceId
            properties:
                chId:
                    description: しょぼいカレンダー ChID
                    type: integer
                networkId:
                    $ref: '#/components/schemas/NetworkId'
                serviceId:
                    $ref: '#/components/schemas/ServiceId'
                syobocal:
                    description: false の場合、この局はしょぼいカレンダーへ未登録として扱い問い合わせをスキップする
                    type: boolean

        SyobocalTitleDictionaryStatus:
            description: しょぼいカレンダー アニメ作品タイトル辞書の状態
            type: object
            required:
                - titleCount
                - lastUpdate
                - lastSyncedAt
                - running
                - error
            properties:
                titleCount:
                    description: 辞書に登録されている作品数
                    type: integer
                lastUpdate:
                    description: しょぼいカレンダー側の最終更新日時 (差分取得カーソル)
                    type: string
                    nullable: true
                lastSyncedAt:
                    description: 直近の同期完了時刻 (UNIX time ms)
                    type: integer
                    nullable: true
                running:
                    description: 同期実行中か
                    type: boolean
                error:
                    description: 直近の同期でのエラーメッセージ
                    type: string
                    nullable: true

        SyobocalTitleSyncResult:
            description: しょぼいカレンダー アニメ作品タイトル辞書の同期結果
            allOf:
                - $ref: '#/components/schemas/SyobocalTitleDictionaryStatus'
                - type: object
                  required:
                      - imported
                      - full
                  properties:
                      imported:
                          description: 今回の同期で取り込んだ作品数
                          type: integer
                      full:
                          description: 全件取得だったか
                          type: boolean

        AnnictWorkDictionaryStatus:
            description: Annict 作品辞書の状態
            type: object
            required:
                - workCount
                - linkedToSyobocalCount
                - lastSyncedAt
                - running
                - error
            properties:
                workCount:
                    description: 辞書に登録されている作品数
                    type: integer
                linkedToSyobocalCount:
                    description: そのうち syobocalTid を持つ (しょぼいカレンダー作品と厳密に結合できる) 作品数
                    type: integer
                lastSyncedAt:
                    description: 直近の同期完了時刻 (UNIX time ms)
                    type: integer
                    nullable: true
                running:
                    description: 同期実行中か
                    type: boolean
                error:
                    description: 直近の同期でのエラーメッセージ
                    type: string
                    nullable: true

        AnnictWorkSyncResult:
            description: Annict 作品辞書の同期結果
            allOf:
                - $ref: '#/components/schemas/AnnictWorkDictionaryStatus'
                - type: object
                  required:
                      - imported
                  properties:
                      imported:
                          description: 今回の同期で取り込んだ作品数
                          type: integer

        SharedDataSyncResult:
