name: build

on:
  push:
    # タグ push は release.yml が同等のビルドを行うため除外する
    tags-ignore: ['**']
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST: ITB nightly

jobs:
  test:
    name: test-${{ matrix.level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [ut, ita]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: npm
    - name: Install server dependencies
      run: npm install
    - name: Run ${{ matrix.level }}
      run: npm run test:${{ matrix.level }}

  itb:
    name: test-itb
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: npm
    - name: Install server dependencies
      run: npm install
    - name: Run ITB
      run: npm run test:itb

  build:

    name: build-${{matrix.os}}-${{matrix.node-version}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        node-version: [24.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: EPGStation

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: install winser on windows
      if: runner.os == 'Windows'
      run: npm install winser -g
      
    - name: Mirakurun Checkout
      uses: actions/checkout@v4
      with:
        ref: stuayu-main
        repository: stuayu/Mirakurun
        path: Mirakurun
    
    - name: Mirakurun build and install
      working-directory: Mirakurun
      run: |
        npm install
    
    - name: Install all
      working-directory: EPGStation
      run: |
        npm run all-install
      
    - name: Build EPGStation
      working-directory: EPGStation
      if: runner.os == 'Windows'
      run: npm run build-win
    
    - name: Build EPGStation
      working-directory: EPGStation
      if: runner.os == 'Linux' || runner.os == 'macOS'
      run: npm run build

    - name: Compress Project
      run: |
        7z a -t7z -mx=9 -m0=lzma2 -md=256m -mfb=273 -ms=on EPGStation-${{ matrix.os }}-${{ matrix.node-version }}.7z ./EPGStation
        7z a -t7z -mx=9 -m0=lzma2 -md=256m -mfb=273 -ms=on Mirakurun-${{ matrix.os }}-${{ matrix.node-version }}.7z ./Mirakurun

    - name: Upload Project as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EPGStation-${{ matrix.os }}-${{ matrix.node-version }}.7z
        path: EPGStation-${{ matrix.os }}-${{ matrix.node-version }}.7z
    
    - name: Upload Project as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mirakurun-${{ matrix.os }}-${{ matrix.node-version }}.7z
        path: Mirakurun-${{ matrix.os }}-${{ matrix.node-version }}.7z