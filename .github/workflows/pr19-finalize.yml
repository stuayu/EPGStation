name: PR19 finalize

on:
  push:
    branches:
      - fix/tsreplace-playback-start-at

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/tsreplace-playback-start-at
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Update changelog
        shell: python
        run: |
          from pathlib import Path

          path = Path('doc/changelog-fork.md')
          text = path.read_text(encoding='utf-8')
          unique = 'tsreplace 出力を含む録画の `video_file.startAt` を最初の映像 PTS の実時刻へ補正し、ニコニコ実況の再生位置 0 秒と同期させた'

          if unique not in text:
              date_entry = '''- **tsreplace 出力を含む録画の `video_file.startAt` を「再生位置 0 秒 = 最初の映像 PTS」の実時刻へ合わせ、ニコニコ実況の過去ログ同期を正確にした**: 従来の TDT/TOT + PCR 補正は TS 先頭付近の PCR の実時刻を求めるところまでは正しかったが、tsreplace 等で映像 PTS/PCR が再構成されると最初に表示される映像 PTS と先頭 PCR にオフセットが残り、コメントが数秒ずれる。対象サービスの PMT から PCR_PID を特定し、先頭 PCR と最初の映像 PTS (無ければ音声 PTS) の差を 27MHz 時間軸で求め、`startAt = firstTdtAt + (firstMediaPTS - firstPCR)` として保存する `TsPlaybackTimeResolver` を追加。33bit wrap に対応し、5 分超の不自然な差・必要情報不足時は従来の `firstTdtAt` へフォールバックする。さらに `EncodeFinishModel` で `addVideoFile()` 直後に `analyzeAll()` を実行し、tsreplace 出力も登録直後に TS/ffprobe を解析して `startAt` を埋める。既存 tsreplace ファイルは TS 再解析で更新できる。

'''
              text = text.replace('## 2026-08-22\n\n', '## 2026-08-22\n\n' + date_entry, 1)

              index_entry = '- tsreplace 出力を含む録画の `video_file.startAt` を最初の映像 PTS の実時刻へ補正し、ニコニコ実況と再生位置 0 秒を同期させた\n'
              text = text.replace('### 録画ファイルの解析・取り込み\n\n', '### 録画ファイルの解析・取り込み\n\n' + index_entry, 1)

              detail_entry = '''- **tsreplace 出力を含む録画の `video_file.startAt` を最初の映像 PTS の実時刻へ補正し、ニコニコ実況の再生位置 0 秒と同期させた**
    - **背景**: 既存の TDT/TOT + PCR 補正は「ファイル先頭付近の PCR が実時間で何時か」を求めていたが、tsreplace 等で PTS/PCR が再構成されると最初に表示される映像 PTS と先頭 PCR の間に数秒の差が残り、`JikkyoKakologClient` の `startAt + currentTime` と実放送時刻がずれる
    - `TsPlaybackTimeResolver` が PMT から PCR_PID と映像/音声 PID を特定し、先頭 PCR と最初の映像 PTS (無ければ音声 PTS) を同じ 27MHz 時間軸へ載せ、`firstTdtAt + (firstMediaPts - firstPcr)` を playback 0 の実時刻として返す
    - 33bit の PTS/PCR wrap に対応し、5 分を超える不自然な差や必要情報不足時は従来の `firstTdtAt` へフォールバックする
    - `EncodeFinishModel` は `addVideoFile()` の直後に `analyzeAll()` を呼び、tsreplace 出力も登録直後に TS/ffprobe 解析して `startAt` を保存する。既存ファイルも TS 再解析で更新できる
    - テストは +2.5 秒オフセット、wrap、音声 PTS fallback、異常値拒否、エンコード完了後の自動解析を固定した

'''
              text = text.replace('## 変更履歴 (新しい順)\n\n', '## 変更履歴 (新しい順)\n\n' + detail_entry, 1)

              if unique not in text:
                  raise RuntimeError('changelog insertion marker was not found')
              path.write_text(text, encoding='utf-8')

      - name: Install server dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:ut

      - name: Run integration tests
        run: npm run test:ita

      - name: Compile server
        run: npm run compile

      - name: Commit changelog and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr19-finalize.yml
          git add doc/changelog-fork.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: startAt 同期修正を変更ログに追記"
          git push origin HEAD:fix/tsreplace-playback-start-at
